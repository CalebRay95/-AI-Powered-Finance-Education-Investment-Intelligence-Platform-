<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark rounded background matching the app's bg-gray-900 theme -->
  <rect width="32" height="32" rx="6" fill="#111827"/>

  <!-- Ascending bar chart — three bars growing left to right -->
  <rect x="3"  y="22" width="5.5" height="7"  rx="1.2" fill="#059669"/>
  <rect x="11" y="16" width="5.5" height="13" rx="1.2" fill="#10b981"/>
  <rect x="19" y="10" width="5.5" height="19" rx="1.2" fill="#34d399"/>

  <!-- Trend line connecting bar tops -->
  <polyline
    points="5.75,22 13.75,16 21.75,10"
    stroke="#6ee7b7"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Upward arrow at the end of the trend line -->
  <polyline
    points="19,12 21.75,10 24.5,12"
    stroke="#6ee7b7"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
